name: Hilega-Milega v4.0 PRO — Daily EOD Auto-Sync

on:
  schedule:
    # Runs at 13:45 UTC (19:15 IST / 7:15 PM IST) Mon-Fri
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eod-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install pandas numpy requests openpyxl

      - name: Run EOD Pipeline & Rebuild Web/Mobile Portal Data
        run: python HilegaMilega_Auto_Launcher.py --mode eod --dir .

      - name: Commit & Push Updated Data for Streamlit Cloud
        run: |
          git config user.name "HilegaMilega-AutoBot"
          git config user.email "autobot@users.noreply.github.com"
          git add HilegaMilega_PRO_Terminal.html hm_data.json
          git diff --staged --quiet || (git commit -m "Auto-sync EOD Hilega-Milega v4.0 data" && git push)

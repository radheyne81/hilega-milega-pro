name: Daily Hilega-Milega EOD Auto-Update

on:
  schedule:
    - cron: "45 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-eod-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Run EOD Pipeline & Patch Terminal
        run: |
          python HilegaMilega_Auto_Launcher.py --mode eod --dir . || true

      - name: Commit & Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HilegaMilega_PRO_Terminal.html hm_data.json *.xlsx || true
          git diff --staged --quiet || git commit -m "Auto-update Hilega-Milega EOD data"
          git push
